<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golden Earth Live Wallpaper</title>

<style>
  :root {
    --bg: url("HeroWallp.png");
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .wallpaper {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background-image: var(--bg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /*
    VAŽNO:
    Ovo nisu novi zraci.
    Svaki .beam-copy je ista originalna slika,
    samo isečena oko postojećeg zraka i animirana kroz opacity/filter.
  */

  .beam-copy {
    position: absolute;
    inset: 0;
    background-image: var(--bg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;

    opacity: 0.12;
    filter:
      brightness(1.25)
      contrast(1.08)
      saturate(1.18)
      drop-shadow(0 0 10px rgba(255, 190, 40, 0.45));

    animation:
      beamGlow 5.8s ease-in-out infinite,
      beamBreath 8s ease-in-out infinite;
  }

  .beam-copy.strong {
    opacity: 0.18;
    filter:
      brightness(1.4)
      contrast(1.12)
      saturate(1.25)
      drop-shadow(0 0 16px rgba(255, 205, 70, 0.6));
  }

  /* POSTOJEĆI ZRAKOVI — maske su namerno uske da ne prave nove trouglove */

  .beam-left-edge {
    clip-path: polygon(
      0% 0%,
      8% 0%,
      15% 68%,
      12% 73%,
      4% 35%
    );
    animation-delay: -0.8s, -2s;
  }

  .beam-left-big {
    clip-path: polygon(
      6% 0%,
      16% 0%,
      15% 70%,
      12% 71%,
      8% 33%
    );
    animation-delay: -2.2s, -1s;
  }

  .beam-left-small {
    clip-path: polygon(
      20% 0%,
      25% 0%,
      22% 53%,
      20.5% 53%,
      19.5% 31%
    );
    animation-delay: -1.1s, -3s;
  }

  .beam-left-mid {
    clip-path: polygon(
      20% 0%,
      30% 0%,
      28% 60%,
      25.5% 60%,
      21.5% 25%
    );
    animation-delay: -3.4s, -1.6s;
  }

  .beam-center {
    clip-path: polygon(
      45% 0%,
      55% 0%,
      51% 70%,
      49% 70%,
      46% 20%
    );
    animation-delay: -0.4s, -2.4s;
  }

  .beam-center-wide {
    clip-path: polygon(
      41% 0%,
      58% 0%,
      53% 67%,
      47% 67%,
      43% 17%
    );
    animation-delay: -2.8s, -4s;
  }

  .beam-mid-right {
    clip-path: polygon(
      62% 0%,
      68% 0%,
      65% 56%,
      64% 56%,
      63% 32%
    );
    animation-delay: -1.7s, -2.8s;
  }

  .beam-right-small {
    clip-path: polygon(
      73% 0%,
      78% 0%,
      76% 52%,
      74.5% 52%,
      73.5% 30%
    );
    animation-delay: -3.1s, -1.3s;
  }

  .beam-right-big {
    clip-path: polygon(
      84% 0%,
      100% 0%,
      91% 86%,
      87% 86%,
      88% 38%
    );
    animation-delay: -2s, -3.5s;
  }

  .beam-far-right {
    clip-path: polygon(
      94% 0%,
      100% 0%,
      100% 72%,
      97% 72%,
      95% 27%
    );
    animation-delay: -4s, -1.8s;
  }

  /*
    Ovo je takođe kopija originalne slike,
    samo blago pojačava postojeći zlatni horizont.
  */

  .horizon-copy {
    position: absolute;
    inset: 0;
    background-image: var(--bg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;

    clip-path: polygon(
      0% 31%,
      100% 31%,
      100% 51%,
      0% 51%
    );

    opacity: 0.08;
    filter:
      brightness(1.25)
      saturate(1.2)
      blur(1px);

    animation: horizonSoftGlow 7s ease-in-out infinite;
  }

  @keyframes beamGlow {
    0%, 100% {
      opacity: 0.08;
      filter:
        brightness(1.12)
        contrast(1.04)
        saturate(1.1)
        drop-shadow(0 0 6px rgba(255, 185, 40, 0.25));
    }

    50% {
      opacity: 0.24;
      filter:
        brightness(1.55)
        contrast(1.14)
        saturate(1.35)
        drop-shadow(0 0 22px rgba(255, 210, 80, 0.75));
    }
  }

  @keyframes beamBreath {
    0%, 100% {
      transform: translateY(0) scaleX(1);
    }

    50% {
      transform: translateY(-3px) scaleX(1.015);
    }
  }

  @keyframes horizonSoftGlow {
    0%, 100% {
      opacity: 0.05;
      filter: brightness(1.1) saturate(1.1) blur(1px);
    }

    50% {
      opacity: 0.14;
      filter: brightness(1.35) saturate(1.25) blur(1.5px);
    }
  }

  /*
    Blago treperenje cele zlatne energije.
    Nije novi sloj, samo veoma suptilan svetlosni puls.
  */

  .golden-pulse {
    position: absolute;
    inset: 0;
    background-image: var(--bg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;

    clip-path: polygon(
      0% 0%,
      100% 0%,
      100% 78%,
      0% 78%
    );

    opacity: 0.025;
    filter: brightness(1.35) saturate(1.3);
    animation: globalGoldPulse 9s ease-in-out infinite;
  }

  @keyframes globalGoldPulse {
    0%, 100% {
      opacity: 0.015;
    }

    50% {
      opacity: 0.055;
    }
  }
</style>
</head>

<body>
  <div class="wallpaper">

    <div class="horizon-copy"></div>

    <div class="beam-copy beam-left-edge"></div>
    <div class="beam-copy strong beam-left-big"></div>
    <div class="beam-copy beam-left-small"></div>
    <div class="beam-copy strong beam-left-mid"></div>

    <div class="beam-copy strong beam-center"></div>
    <div class="beam-copy beam-center-wide"></div>

    <div class="beam-copy beam-mid-right"></div>
    <div class="beam-copy beam-right-small"></div>

    <div class="beam-copy strong beam-right-big"></div>
    <div class="beam-copy beam-far-right"></div>

    <div class="golden-pulse"></div>

  </div>
</body>
</html>
