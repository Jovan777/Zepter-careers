services:
  mongo:
    image: mongo:7
    container_name: zepter-careers-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
    container_name: zepter-careers-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-11002}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/zepter-careers
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-strong-secret}
      CONTACT_SECURITY_SECRET: ${CONTACT_SECURITY_SECRET:-replace-with-a-strong-contact-security-secret}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:11001}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-karijera@zepter.rs}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Zepter Careers}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_TLS_MIN_VERSION: ${SMTP_TLS_MIN_VERSION:-}
    volumes:
      - "${UPLOADS_HOST_PATH:-backend_uploads}:/app/uploads"

  frontend:
    build:
      context: ./client
      args:
        VITE_PUBLIC_BASE_PATH: ${VITE_PUBLIC_BASE_PATH:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_ADMIN_LOGIN_PATH: ${VITE_ADMIN_LOGIN_PATH:-/secure-zc-panel-8f4k/login}
    container_name: zepter-careers-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-11001}:80"

  seed:
    image: mongo:7
    container_name: zepter-careers-seed
    profiles:
      - seed
    depends_on:
      - mongo
    working_dir: /seed
    volumes:
      - ./server/seed:/seed:ro
    command: >
      sh -c 'mongosh "mongodb://mongo:27017/zepter-careers" zepter-careers-seed.mongosh.js'

volumes:
  mongo_data:
  backend_uploads:
